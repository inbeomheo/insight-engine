worker_processes 1;
pid ${NGINX_TEMP_ROOT}/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path ${NGINX_TEMP_ROOT}/client_body;
    proxy_temp_path ${NGINX_TEMP_ROOT}/proxy;
    fastcgi_temp_path ${NGINX_TEMP_ROOT}/fastcgi;
    uwsgi_temp_path ${NGINX_TEMP_ROOT}/uwsgi;
    scgi_temp_path ${NGINX_TEMP_ROOT}/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Railway terminates TLS and overwrites these headers at the public edge.
    # Normalize each value before passing exactly one trusted hop to ProxyFix.
    map $http_x_forwarded_proto $railway_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    map $http_x_real_ip $railway_client_ip {
        default $remote_addr;
        "~^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$" $http_x_real_ip;
        ~^[0-9A-Fa-f:]+$ $http_x_real_ip;
    }

    server {
        listen ${PORT};
        server_name _;
        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $railway_client_ip;
        proxy_set_header X-Forwarded-For $railway_client_ip;
        proxy_set_header X-Forwarded-Proto $railway_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /health {
            proxy_pass http://127.0.0.1:5001;
        }

        location = /ready {
            proxy_pass http://127.0.0.1:5001;
        }

        location = /api/og {
            proxy_pass http://127.0.0.1:3000;
        }

        location ^~ /share/ {
            proxy_pass http://127.0.0.1:5001;
        }

        location ^~ /api/shares/ {
            proxy_pass http://127.0.0.1:5001;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5001;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(generate|generate-stream|generate-batch)$ {
            proxy_pass http://127.0.0.1:5001;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        location ~ ^/(feed\.xml|version|metrics|openapi\.json)$ {
            proxy_pass http://127.0.0.1:5001;
            proxy_buffering off;
        }

        location /oauth/ {
            proxy_pass http://127.0.0.1:5001;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_read_timeout 300s;
        }
    }
}
