# Nixpacks 빌드 설정 - Python 프로젝트 명시
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc", "ffmpeg"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --preload"
