# Insight Engine Kubernetes Deployment (F9-24)
# 적용: kubectl apply -f k8s/

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-backend
  namespace: insight-engine
  labels:
    app: insight-backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insight-backend
  template:
    metadata:
      labels:
        app: insight-backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5001"
    spec:
      containers:
        - name: backend
          image: insight-engine-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - secretRef:
                name: insight-secrets
            - configMapRef:
                name: insight-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-cache
              mountPath: /app/cache
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: insight-data-pvc
        - name: app-cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insight-frontend
  namespace: insight-engine
  labels:
    app: insight-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insight-frontend
  template:
    metadata:
      labels:
        app: insight-frontend
    spec:
      containers:
        - name: frontend
          image: insight-engine-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://insight-backend-svc:5001
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: insight-backend-svc
  namespace: insight-engine
spec:
  selector:
    app: insight-backend
  ports:
    - port: 5001
      targetPort: 5001
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: insight-frontend-svc
  namespace: insight-engine
spec:
  selector:
    app: insight-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insight-ingress
  namespace: insight-engine
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - insight.example.com
      secretName: insight-tls
  rules:
    - host: insight.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: insight-backend-svc
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: insight-frontend-svc
                port:
                  number: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insight-backend-hpa
  namespace: insight-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insight-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insight-config
  namespace: insight-engine
data:
  FLASK_ENV: "production"
  REDIS_URL: "redis://insight-redis-svc:6379/0"
  CHROMA_DB_PATH: "/app/data/chroma_db"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: insight-data-pvc
  namespace: insight-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
