server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Next.js가 직접 제공하는 OG 이미지 API는 일반 Flask /api 프록시보다 우선한다.
    location = /api/og {
        proxy_pass http://frontend:3000;
    }

    # 공개 공유 조회는 Flask가 제공한다. POST /api/shares도 아래 /api/로 전달된다.
    location ^~ /share/ {
        proxy_pass http://backend:5001;
    }

    location ^~ /api/shares/ {
        proxy_pass http://backend:5001;
    }

    location /api/ {
        proxy_pass http://backend:5001;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /generate {
        proxy_pass http://backend:5001;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /generate-stream {
        proxy_pass http://backend:5001;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /generate-batch {
        proxy_pass http://backend:5001;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:5001;
    }

    location = /ready {
        proxy_pass http://backend:5001;
    }

    # Flask가 루트 경로에 노출하는 공개/운영 엔드포인트도 Next.js로
    # 흘려보내지 않는다. Caddy 배포 구성과 동일한 라우팅 표면이다.
    location ~ ^/(feed\.xml|version|metrics|openapi\.json)$ {
        proxy_pass http://backend:5001;
        proxy_buffering off;
    }

    location /oauth/ {
        proxy_pass http://backend:5001;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
