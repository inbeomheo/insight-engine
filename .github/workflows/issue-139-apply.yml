name: Apply issue 139 implementation

on:
  push:
    branches:
      - feat/issue-139-anki-apkg-export-20260904

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-139-applied]') && !contains(github.event.head_commit.message, '[issue-139-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-139-anki-apkg-export-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate implementation
        run: |
          python .github/issue-139-apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('services/export/anki_export_service.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from html import escape\n'
          if 'from pathlib import Path\n' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Path import anchor mismatch')
              text = text.replace(anchor, anchor + 'from pathlib import Path\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 genanki==0.13.1

      - name: Run Anki export tests
        run: |
          set +e
          python -m pytest tests/test_anki_export_service.py tests/test_anki_export_contract.py -q 2>&1 | tee .github/issue-139-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f .github/issue-139-test.log
            git commit -m 'test: capture Anki export failure [issue-139-diagnostic]'
            git push origin HEAD:feat/issue-139-anki-apkg-export-20260904
            exit "$status"
          fi
          rm -f .github/issue-139-test.log
          python -m compileall -q services/export/anki_export_service.py routes/export_routes.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check frontend integration
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base_sha=$(git rev-parse HEAD)
          set +e
          {
            git rm -f --ignore-unmatch .github/issue-139-apply.py .github/workflows/issue-139-apply.yml .github/issue-139-test.log .github/issue-139-final.log
            git add -A
            git status --short
            git diff --cached --check
            git commit -m 'feat(export): add Anki apkg deck export [issue-139-applied]'
            git push origin HEAD:feat/issue-139-anki-apkg-export-20260904
          } 2>&1 | tee /tmp/issue-139-final.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git reset --hard "$base_sha"
            cp /tmp/issue-139-final.log .github/issue-139-final.log
            git add -f .github/issue-139-final.log
            git commit -m 'test: capture Anki finalization failure [issue-139-diagnostic]'
            git push origin HEAD:feat/issue-139-anki-apkg-export-20260904
            exit "$status"
          fi
