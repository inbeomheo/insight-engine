# Insight Engine CI/CD 파이프라인 (F9-11)
# 트리거: main/develop 브랜치 푸시, PR

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 백엔드 테스트 ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
      SUPABASE_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__,migrations,node_modules --count --statistics

      - name: 단위 테스트 실행
        run: |
          python -m pytest tests/ \
            -v \
            --ignore=tests/e2e \
            --tb=short \
            -x \
            --timeout=60 \
            -p no:warnings \
            2>&1 | head -500

      - name: 커버리지 업로드
        if: github.ref == 'refs/heads/main'
        run: |
          pip install coverage pytest-cov
          python -m pytest tests/ --ignore=tests/e2e --cov=. --cov-report=xml -q
        continue-on-error: true

  # ── 프론트엔드 테스트 ─────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001

  # ── Docker 빌드 ───────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/insight-engine:latest
            ${{ secrets.DOCKER_USERNAME }}/insight-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 프로덕션 배포 ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Railway)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Railway 배포
        uses: bervProject/railway-deploy@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: insight-engine
        continue-on-error: true
