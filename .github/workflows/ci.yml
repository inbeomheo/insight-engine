name: CI/CD

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
      SUPABASE_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint fatal Python errors
        run: |
          flake8 . --select=E9,F63,F7,F82 --exclude=__pycache__,migrations,node_modules --count --show-source --statistics
          flake8 . --max-line-length=120 --exclude=__pycache__,migrations,node_modules --count --statistics --exit-zero
      - name: Run backend tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/e2e \
            --tb=short \
            --timeout=60 \
            -p no:warnings \
            -q
      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        run: |
          pip install coverage pytest-cov
          python -m pytest tests/ --ignore=tests/e2e --cov=. --cov-report=xml -q
        continue-on-error: true

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: E2E dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run smoke E2E
        working-directory: tests/e2e
        run: npx playwright test main-page/ci-smoke.spec.ts --project=no-auth-chromium
        env:
          FLASK_ENV: testing
          RATE_LIMIT_ENABLED: "false"
          SUPABASE_ENABLED: "false"
          NEXT_PUBLIC_API_URL: http://localhost:5001

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-smoke]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve Docker image tags
        id: docker-meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo 'tags<<EOF'
              echo "insight-engine:pr-${{ github.event.pull_request.number }}"
              echo "insight-engine:${{ github.sha }}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "${DOCKER_USERNAME}/insight-engine:latest"
              echo "${DOCKER_USERNAME}/insight-engine:${{ github.sha }}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Railway)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Railway Deploy
        uses: bervProject/railway-deploy@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: insight-engine
