# Insight Engine CI/CD 파이프라인 (F9-11)
# 운영 브랜치 deploy-master도 테스트와 Docker 재현성 검증을 반드시 통과한다.
# 실제 배포는 서버에서 승인 후 수행하며 CI는 외부 레지스트리/철도 배포를 하지 않는다.

name: CI/CD

on:
  push:
    branches: [main, master, develop, deploy-master]
  pull_request:
    branches: [main, master, develop, deploy-master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 백엔드 테스트 ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
      SUPABASE_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing
      AUTH_BYPASS: "true"
      # 테스트는 Flask-Limiter 레이트리밋 대상이 아니어야 한다. Redis가 있는
      # CI에선 한도 상태가 테스트 간 공유되어 순서 의존적 429가 발생하므로 끈다.
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 (flake8, 권고)
        # 레포 전역 flake8 부채(약 760건)가 정리되기 전까지는 권고(비차단)로 운영한다.
        # TODO: 위반을 점진적으로 0으로 줄인 뒤 continue-on-error 제거.
        continue-on-error: true
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__,migrations,node_modules --count --statistics

      - name: 단위 테스트 실행
        # pytest는 런타임 의존성이 아니라 requirements.txt에 없으므로 여기서 설치.
        # (-x 제거: 첫 실패에서 멈추지 않고 전체 실패 목록을 피드백으로 받는다.
        #  기존 `| head -500` 파이프는 pipefail 부재로 실패를 삼키던 결함이라 제거.)
        #
        # 격리 — CI에 없는 미선언 의존성 때문에 깨지는 테스트만 제외:
        #  - web_feature_test: playwright 수동 스모크 (로컬 서버 필요)
        # (duckduckgo_search가 requirements.txt에 선언됨(PR #26) → 기존
        #  test_web_research_* / test_fusion_service / TestGenerateFusion 격리는 해제)
        run: |
          pip install pytest pytest-timeout
          python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/web_feature_test.py \
            --tb=short \
            --timeout=120 \
            -p no:warnings \
            -q

      - name: 커버리지 업로드
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy-master'
        run: |
          pip install coverage pytest-cov
          python -m pytest tests/ --ignore=tests/e2e --cov=. --cov-report=xml -q
        continue-on-error: true

  # ── 프론트엔드 테스트 ─────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 단위 테스트 (vitest)
        # PR #70에서 vitest 도입 — CI 연동 (package.json "test": "vitest run")
        run: npm test -- --reporter=dot

      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001

  # ── Docker 빌드 ───────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy-master'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 재현성 검증
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: insight-engine:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
