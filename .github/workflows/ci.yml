# Insight Engine CI/CD 파이프라인 (F9-11)
# 트리거: main/master/develop 브랜치 푸시, PR
#   - 이 레포의 기본 브랜치는 master이며 모든 PR이 master를 대상으로 한다.
#     master가 빠져 있어 PR CI가 한 번도 실행되지 않던 문제를 수정.
#   - docker-build/deploy/커버리지 잡의 refs/heads/main 게이트는 의도적으로 유지:
#     master로 바꾸면 푸시마다 Docker Hub 푸시 + Railway 프로덕션 배포가 켜지므로
#     자동 배포는 명시적 운영 결정 전까지 비활성 상태로 둔다 (2026-07-05 결정).

name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 백엔드 테스트 ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
      SUPABASE_ENABLED: "false"
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing
      AUTH_BYPASS: "true"
      # 테스트는 Flask-Limiter 레이트리밋 대상이 아니어야 한다. Redis가 있는
      # CI에선 한도 상태가 테스트 간 공유되어 순서 의존적 429가 발생하므로 끈다.
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 (flake8, 권고)
        # 레포 전역 flake8 부채(약 760건)가 정리되기 전까지는 권고(비차단)로 운영한다.
        # TODO: 위반을 점진적으로 0으로 줄인 뒤 continue-on-error 제거.
        continue-on-error: true
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__,migrations,node_modules --count --statistics

      - name: 단위 테스트 실행
        # pytest는 런타임 의존성이 아니라 requirements.txt에 없으므로 여기서 설치.
        # (-x 제거: 첫 실패에서 멈추지 않고 전체 실패 목록을 피드백으로 받는다.
        #  기존 `| head -500` 파이프는 pipefail 부재로 실패를 삼키던 결함이라 제거.)
        #
        # 격리 — CI에 없는 미선언 의존성 때문에 깨지는 테스트만 제외:
        #  - web_feature_test: playwright 수동 스모크 (로컬 서버 필요)
        # (duckduckgo_search가 requirements.txt에 선언됨(PR #26) → 기존
        #  test_web_research_* / test_fusion_service / TestGenerateFusion 격리는 해제)
        run: |
          pip install pytest pytest-timeout
          python -m pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/web_feature_test.py \
            --tb=short \
            --timeout=120 \
            -p no:warnings \
            -q

      - name: 커버리지 업로드
        if: github.ref == 'refs/heads/main'
        run: |
          pip install coverage pytest-cov
          python -m pytest tests/ --ignore=tests/e2e --cov=. --cov-report=xml -q
        continue-on-error: true

  # ── 프론트엔드 테스트 ─────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 단위 테스트 (vitest)
        # PR #70에서 vitest 도입 — CI 연동 (package.json "test": "vitest run")
        run: npm test -- --reporter=dot

      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001

  # ── Docker 빌드 ───────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/insight-engine:latest
            ${{ secrets.DOCKER_USERNAME }}/insight-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 프로덕션 배포 ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Railway)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Railway 배포
        uses: bervProject/railway-deploy@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: insight-engine
        continue-on-error: true
