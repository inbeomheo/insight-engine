<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insight Engine</title>
  <style>
    :root {
      --bg: #0f0e17;
      --surface: #1a1828;
      --surface2: #231f38;
      --border: #2d2b45;
      --text: #e8e6f0;
      --text-muted: #8b89a0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-bg: rgba(99, 102, 241, 0.12);
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── 헤더 ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo { font-size: 16px; }

    .header-title {
      font-size: 14px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    /* ── URL 입력 영역 ── */
    .url-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .url-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .url-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
      min-width: 0;
      transition: border-color 0.2s;
    }

    .url-input:focus { border-color: var(--accent); }
    .url-input::placeholder { color: var(--text-muted); }

    /* ── 설정 패널 ── */
    .settings {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--accent); }

    /* ── 스타일 선택 ── */
    .style-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .style-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .style-chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .style-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .style-chip.selected {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── 생성 버튼 ── */
    .generate-section {
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .generate-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .generate-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--accent-hover), #7c3aed);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── 결과 영역 ── */
    .result-section {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .result-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 10px;
    }

    .result-placeholder-icon { font-size: 36px; }

    .result-placeholder-text {
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── 로딩 ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      color: var(--text-muted);
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-steps {
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }

    /* ── 결과 카드 ── */
    .result-card {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .result-card.visible { display: flex; }

    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
    }

    .result-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-chip {
      padding: 3px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .result-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      max-height: 400px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .result-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .action-btn.accent {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── 에러 ── */
    .error-msg {
      display: none;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: var(--error);
      font-size: 12px;
      line-height: 1.6;
    }

    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <div class="header">
      <div class="header-left">
        <span class="header-logo">✨</span>
        <span class="header-title">Insight Engine</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" title="새로고침">↺</button>
        <button class="icon-btn" id="settings-btn" title="설정">⚙</button>
      </div>
    </div>

    <!-- URL 입력 -->
    <div class="url-section">
      <div class="field-label">YouTube URL</div>
      <div class="url-row">
        <input
          type="text"
          class="url-input"
          id="url-input"
          placeholder="https://www.youtube.com/watch?v=..."
        />
      </div>
    </div>

    <!-- 스타일 선택 -->
    <div class="style-section">
      <div class="field-label" style="margin-bottom: 8px;">스타일</div>
      <div class="style-scroll" id="style-scroll">
        <div class="style-chip selected" data-style="blog_seo">📝 SEO 블로그</div>
        <div class="style-chip" data-style="summary">📋 요약</div>
        <div class="style-chip" data-style="tutorial">🎓 튜토리얼</div>
        <div class="style-chip" data-style="qna">❓ Q&A</div>
        <div class="style-chip" data-style="newsletter">📰 뉴스레터</div>
        <div class="style-chip" data-style="sns_post">📱 SNS</div>
        <div class="style-chip" data-style="brunch_essay">✍️ 에세이</div>
        <div class="style-chip" data-style="yozm_it">💻 IT 기술</div>
      </div>
    </div>

    <!-- AI 설정 -->
    <div class="settings">
      <div class="settings-grid">
        <div>
          <div class="field-label">길이</div>
          <select id="length-select">
            <option value="short">짧게</option>
            <option value="medium" selected>보통</option>
            <option value="long">길게</option>
          </select>
        </div>
        <div>
          <div class="field-label">언어</div>
          <select id="language-select">
            <option value="ko" selected>한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 생성 버튼 -->
    <div class="generate-section">
      <button class="generate-btn" id="generate-btn">
        <span>✨</span>
        <span>콘텐츠 생성</span>
      </button>
    </div>

    <!-- 결과 영역 -->
    <div class="result-section" id="result-section">
      <!-- 초기 안내 -->
      <div class="result-placeholder" id="placeholder">
        <div class="result-placeholder-icon">🎬</div>
        <div class="result-placeholder-text">
          YouTube 영상 URL을 입력하고<br>
          생성 버튼을 누르세요
        </div>
      </div>

      <!-- 로딩 -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-steps" id="loading-steps">
          자막을 추출하는 중...<br>
          <span style="font-size: 10px; opacity: 0.6;">최대 2분 소요</span>
        </div>
      </div>

      <!-- 에러 -->
      <div class="error-msg" id="error-msg"></div>

      <!-- 결과 카드 -->
      <div class="result-card" id="result-card">
        <div class="result-title" id="result-title"></div>
        <div class="result-meta" id="result-meta"></div>
        <div class="result-content" id="result-content"></div>
        <div class="result-actions">
          <button class="action-btn" id="copy-btn">📋 복사</button>
          <button class="action-btn" id="copy-md-btn">📝 마크다운 복사</button>
          <button class="action-btn accent" id="regen-btn">🔄 재생성</button>
        </div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
