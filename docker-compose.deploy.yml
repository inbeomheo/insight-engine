services:
  backend:
    build:
      context: .
      target: final
    image: insight-engine:local
    container_name: insight-backend
    restart: unless-stopped
    command: ["tini", "--", "python", "/app/scripts/run_full_stack.py", "backend"]
    stop_grace_period: 630s
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      HOME: /app/persist/data/home
      PORT: "5001"
      BACKEND_BIND_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
      CHATMOCK_BASE_URL: http://chatmock:8000/v1
      CHATMOCK_API_KEY: ${CHATMOCK_API_KEY:-dummy}
      CHROMA_DB_PATH: /app/persist/data/chroma_db
      GRAPH_STORE_PATH: /app/persist/data/graph_store
      KNOWLEDGE_NOTES_DIR: /app/persist/data/notes
      SHARE_PAGE_DIR: /app/persist/data/shared_pages
      FEEDBACK_DATA_DIR: /app/persist/data/feedback
      FEEDBACK_STORE_DIR: /app/persist/data/feedback
      APP_DATA_DIR: /app/persist/data
      APP_DATA_BACKUP_DIR: /app/persist/backups
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-false}
      AUTO_BACKUP_INTERVAL_HOURS: ${AUTO_BACKUP_INTERVAL_HOURS:-24}
      BACKUP_INITIAL_DELAY_SECONDS: ${BACKUP_INITIAL_DELAY_SECONDS:-300}
      MAX_BACKUPS: ${MAX_BACKUPS:-30}
      BACKUP_QUIESCE_TIMEOUT_SECONDS: ${BACKUP_QUIESCE_TIMEOUT_SECONDS:-600}
      BACKEND_GRACEFUL_TIMEOUT_SECONDS: ${BACKEND_GRACEFUL_TIMEOUT_SECONDS:-600}
      NGINX_DRAIN_TIMEOUT_SECONDS: ${NGINX_DRAIN_TIMEOUT_SECONDS:-605}
      BACKUP_SHUTDOWN_TIMEOUT_SECONDS: ${BACKUP_SHUTDOWN_TIMEOUT_SECONDS:-10}
      PROCESS_SHUTDOWN_TIMEOUT_SECONDS: ${PROCESS_SHUTDOWN_TIMEOUT_SECONDS:-605}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS origin}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?Set METRICS_AUTH_TOKEN}
      PLATFORM_VOLUME_BACKUPS_ENABLED: ${PLATFORM_VOLUME_BACKUPS_ENABLED:?Enable independent platform volume backups and set true}
    ports:
      - "127.0.0.1:5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - insight_app_persist:/app/persist
    depends_on:
      redis:
        condition: service_healthy
      chatmock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      target: final
    image: insight-engine:local
    container_name: insight-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    command: ["tini", "--", "python", "/app/scripts/run_full_stack.py", "frontend"]
    stop_grace_period: 630s
    environment:
      NODE_ENV: production
      NEXT_BACKEND_URL: http://backend:5001
      FRONTEND_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  edge:
    image: caddy:2-alpine
    container_name: insight-edge
    restart: unless-stopped
    stop_grace_period: 630s
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./Caddyfile.deploy:/etc/caddy/Caddyfile:ro
    environment:
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?Set CADDY_BASIC_AUTH_USER}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?Set CADDY_BASIC_AUTH_HASH}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chatmock:
    build:
      context: .
      target: chatmock
    image: insight-engine-chatmock:1.40
    container_name: insight-chatmock
    restart: unless-stopped
    environment:
      CODEX_HOME: /data/codex
      CHATGPT_LOCAL_HOME: /data/codex
      HOME: /data
      CHATGPT_LOCAL_REASONING_EFFORT: minimal
      CHATGPT_LOCAL_FAST_MODE: "true"
    volumes:
      - insight_chatmock_credentials:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  chatmock-login:
    build:
      context: .
      target: chatmock
    image: insight-engine-chatmock:1.40
    profiles: ["chatmock-login"]
    command: ["chatmock", "login"]
    environment:
      CODEX_HOME: /data/codex
      CHATGPT_LOCAL_HOME: /data/codex
      HOME: /data
    volumes:
      - insight_chatmock_credentials:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true

  redis:
    image: redis:7-alpine
    container_name: insight-redis
    restart: unless-stopped
    # 사용량 잠금/차감 장애 키가 메모리 압박에서 축출되면 중복 요청이
    # 허용될 수 있다. 메모리 부족은 명령 실패(fail-closed)로 드러내도록 한다.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - insight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  insight_app_persist:
  insight_chatmock_credentials:
  insight_redis_data:
