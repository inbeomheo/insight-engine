services:
  backend:
    build:
      context: .
      target: final
    image: insight-engine:local
    container_name: insight-backend
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - gunicorn
      - --workers=2
      - --threads=4
      - --timeout=300
      - --bind=0.0.0.0:5001
      - app:create_app()
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      HOME: /app
      PORT: "5001"
      REDIS_URL: redis://redis:6379/0
      MEDIA_REDIS_URL: redis://media-redis:6379/0
      CHROMA_DB_PATH: /app/data/chroma_db
      AI_CACHE_DB: /app/cache/ai_cache.db
      JOB_STORE_DIR: /app/data/jobs
      MEDIA_TRANSCRIPTION_DIR: /app/data/media-transcriptions
      CLIPROXY_BASE_URL: http://cli-proxy-api:8317/v1
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      WHISPER_ENABLED: "true"
      WHISPER_MODEL_SIZE: base
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: trusted_proxy
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET}
      LEGACY_NOTES_OWNER_ID: proxy_inbeom
    ports:
      - "127.0.0.1:5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - insight_app_data:/app/data
      - insight_app_cache:/app/cache
      - insight_app_logs:/app/logs
      # Chroma의 기본 ONNX 임베딩 모델은 $HOME/.cache 아래에 내려받는다.
      # 컨테이너 재생성 때 다시 다운로드하지 않도록 별도 보존한다.
      - insight_model_cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
      media-redis:
        condition: service_healthy
      cli-proxy-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  media-worker:
    image: insight-engine:local
    container_name: insight-media-worker
    restart: unless-stopped
    command:
      - rq
      - worker
      - --url
      - redis://media-redis:6379/0
      - media-transcription
    env_file:
      - .env
    environment:
      HOME: /app
      REDIS_URL: redis://redis:6379/0
      MEDIA_REDIS_URL: redis://media-redis:6379/0
      MEDIA_TRANSCRIPTION_DIR: /app/data/media-transcriptions
      WHISPER_ENABLED: "true"
      WHISPER_MODEL_SIZE: base
    volumes:
      - insight_app_data:/app/data
      - insight_model_cache:/app/.cache
    depends_on:
      media-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rq info --url redis://media-redis:6379/0 | grep -q 'workers'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    image: insight-engine:local
    container_name: insight-frontend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    working_dir: /app/frontend
    command:
      - node
      - node_modules/.bin/next
      - start
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_BACKEND_URL: http://backend:5001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  edge:
    image: caddy@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    container_name: insight-edge
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./Caddyfile.deploy:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.146
    container_name: insight-cliproxy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - /home/heo/cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml:ro
      - /home/heo/cliproxyapi/auths:/root/.cli-proxy-api
      - /home/heo/cliproxyapi/logs:/CLIProxyAPI/logs
    healthcheck:
      # The official image intentionally ships without curl/wget/nc. Check the
      # IPv4/IPv6 kernel socket tables for a listening 8317 (hex 207D) socket.
      test: ["CMD-SHELL", "for f in /proc/net/tcp /proc/net/tcp6; do while read -r sl local_address rest; do case \"$$local_address\" in *:207D) exit 0;; esac; done < \"$$f\"; done; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: insight-redis
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - insight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: insight-media-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - insight_media_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  insight_app_data:
  insight_app_cache:
  insight_app_logs:
  insight_redis_data:
  insight_media_redis_data:
  insight_model_cache:
