# Insight Engine Docker Compose (F9-10)
# 사용법:
#   docker-compose up -d          # 백그라운드 실행
#   docker-compose logs -f        # 로그 확인
#   docker-compose down           # 중지
#   docker-compose down -v        # 중지 + 볼륨 삭제

version: '3.9'

services:
  # Flask 백엔드
  backend:
    build:
      context: .
      target: final
    image: insight-engine-backend:latest
    container_name: insight-backend
    restart: unless-stopped
    command: ["tini", "--", "python", "/app/scripts/run_full_stack.py", "backend"]
    stop_grace_period: 630s
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - CHATMOCK_BASE_URL=${CHATMOCK_BASE_URL:-http://host.docker.internal:8000/v1}
      - CHATMOCK_API_KEY=${CHATMOCK_API_KEY:-dummy}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_BIND_HOST=0.0.0.0
      - CHROMA_DB_PATH=/app/persist/data/chroma_db
      - GRAPH_STORE_PATH=/app/persist/data/graph_store
      - KNOWLEDGE_NOTES_DIR=/app/persist/data/notes
      - SHARE_PAGE_DIR=/app/persist/data/shared_pages
      - FEEDBACK_DATA_DIR=/app/persist/data/feedback
      - FEEDBACK_STORE_DIR=/app/persist/data/feedback
      - APP_DATA_DIR=/app/persist/data
      - APP_DATA_BACKUP_DIR=/app/persist/backups
      - AUTO_BACKUP_ENABLED=${AUTO_BACKUP_ENABLED:-false}
      - AUTO_BACKUP_INTERVAL_HOURS=${AUTO_BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_INITIAL_DELAY_SECONDS=${BACKUP_INITIAL_DELAY_SECONDS:-300}
      - MAX_BACKUPS=${MAX_BACKUPS:-30}
      - BACKUP_QUIESCE_TIMEOUT_SECONDS=${BACKUP_QUIESCE_TIMEOUT_SECONDS:-600}
      - BACKEND_GRACEFUL_TIMEOUT_SECONDS=${BACKEND_GRACEFUL_TIMEOUT_SECONDS:-600}
      - NGINX_DRAIN_TIMEOUT_SECONDS=${NGINX_DRAIN_TIMEOUT_SECONDS:-605}
      - BACKUP_SHUTDOWN_TIMEOUT_SECONDS=${BACKUP_SHUTDOWN_TIMEOUT_SECONDS:-10}
      - PROCESS_SHUTDOWN_TIMEOUT_SECONDS=${PROCESS_SHUTDOWN_TIMEOUT_SECONDS:-605}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost}
      - PLATFORM_VOLUME_BACKUPS_ENABLED=${PLATFORM_VOLUME_BACKUPS_ENABLED:-false}
    volumes:
      - app_persist:/app/persist
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - insight-network

  # Next.js 프론트엔드
  frontend:
    build:
      context: .
      target: final
    image: insight-engine-frontend:latest
    container_name: insight-frontend
    restart: unless-stopped
    command: ["tini", "--", "python", "/app/scripts/run_full_stack.py", "frontend"]
    stop_grace_period: 630s
    working_dir: /app/frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_BACKEND_URL=http://backend:5001
      - FRONTEND_BIND_HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - insight-network

  # Redis (캐시 + 세션)
  redis:
    image: redis:7-alpine
    container_name: insight-redis
    restart: unless-stopped
    # 사용량 잠금/차감 장애 키가 메모리 압박에서 축출되면 중복 요청이
    # 허용될 수 있다. 메모리 부족은 명령 실패(fail-closed)로 드러내도록 한다.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight-network

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: insight-nginx
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 630s
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - insight-network

volumes:
  app_persist:
    name: insight_app_persist
  redis_data:
    name: insight_redis_data

networks:
  insight-network:
    name: insight_network
    driver: bridge
