# Insight Engine Docker Compose (F9-10)
# 사용법:
#   docker-compose up -d          # 백그라운드 실행
#   docker-compose logs -f        # 로그 확인
#   docker-compose down           # 중지
#   docker-compose down -v        # 중지 + 볼륨 삭제

version: '3.9'

services:
  # Flask 백엔드
  backend:
    build:
      context: .
      target: final
    image: insight-engine-backend:latest
    container_name: insight-backend
    restart: unless-stopped
    command: ["python", "app.py"]
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_DB_PATH=/app/data/chroma_db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - app_data:/app/data
      - app_cache:/app/cache
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - insight-network

  # Next.js 프론트엔드
  frontend:
    build:
      context: .
      target: final
      dockerfile: Dockerfile
    image: insight-engine:latest
    container_name: insight-frontend
    restart: unless-stopped
    command: ["node", "node_modules/.bin/next", "start", "--port", "3000"]
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5001
    depends_on:
      - backend
    networks:
      - insight-network

  # Redis (캐시 + 세션)
  redis:
    image: redis:7-alpine
    container_name: insight-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight-network

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: insight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - insight-network

volumes:
  app_data:
    name: insight_app_data
  app_cache:
    name: insight_app_cache
  app_logs:
    name: insight_app_logs
  redis_data:
    name: insight_redis_data
  nginx_ssl:
    name: insight_nginx_ssl

networks:
  insight-network:
    name: insight_network
    driver: bridge
